<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dmSetter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='m24 8-5.6 16-3.2-7.2L8 13.6z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="brand-badge" data-icon="plane"></div>
    <h1>dmSetter</h1>
    <p id="login-description">Sign in or create an account with your email.</p>
    <form id="login-form">
      <label for="login-email" class="login-label">Email address</label>
      <input id="login-email" type="email" autocomplete="email" inputmode="email" placeholder="you@business.com" required>
      <button class="btn btn-primary" id="login-send" type="submit" style="width:100%;margin-top:16px">Send sign-in link</button>
    </form>
    <div id="login-sent" class="hidden" role="status" aria-live="polite">
      <h2>Check your email</h2>
      <p>A sign-in link was requested for <strong id="login-address"></strong>. Open it in this browser to continue. Check your spam folder too.</p>
      <button class="btn btn-ghost" id="login-change" type="button">Use another email or resend</button>
    </div>
    <div class="login-err" id="login-err" role="alert"></div>
    <button class="btn btn-ghost hidden" id="login-retry" type="button">Retry connection</button>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="brand-row">
      <div class="brand-badge" data-icon="plane"></div>
      <div class="brand-name">dmSetter</div>
    </div>
    <div class="account-chip">
      <div class="avatar" id="acc-avatar" style="background:linear-gradient(135deg,#5a67f2,#8b5cf6)">A</div>
      <div style="flex:1;min-width:0">
        <div class="acc-name" id="acc-name">Account</div>
        <div class="acc-sub" id="acc-sub">Owner</div>
      </div>
      <span data-icon="chevdown" data-size="15"></span>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="nav-item" id="theme-toggle" aria-label="Toggle colour theme"><span class="theme-ico" id="theme-ico"></span><span class="nav-label" id="theme-label">Light Mode</span></button>
      <button class="nav-item" id="logout-btn" aria-label="Log out"><span data-icon="logout" data-size="17"></span><span class="nav-label">Log Out</span></button>
    </div>
  </aside>
  <main id="main">
    <div id="account-access-banner" class="account-access-banner hidden" role="status"></div>
    <section id="view-onboarding" class="hidden"><div class="page" id="onboarding-page"></div></section>
    <section id="view-dashboard" class="hidden"><div class="page" id="dash-page"></div></section>
    <section id="view-messages" class="hidden"></section>
    <section id="view-drafts" class="hidden"><div class="page" id="drafts-page"></div></section>
    <section id="view-prompt" class="hidden"><div class="page" id="prompt-page"></div></section>
    <section id="view-content" class="hidden"><div class="page" id="content-page"></div></section>
    <section id="view-settings" class="hidden"><div class="page" id="settings-page"></div></section>
  </main>
</div>

<div id="toasts"></div>

<script src="/js/icons.js"></script>
<script src="/js/state.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/routing.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/messages.js"></script>
<script src="/js/pages/drafts.js"></script>
<script src="/js/pages/prompt.js"></script>
<script src="/js/pages/content.js"></script>
<script src="/js/pages/settings.js"></script>
<script src="/js/pages/setup.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
